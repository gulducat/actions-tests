name: coordinate

on:
  push:
    branches: [cross-dispatch]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
    steps:
      - name: dispatch success
        run: |-
          gh workflow run \
            --repo gulducat/actions-tests-public \
            --ref main \
            --field should_fail=false \
            sleepy.yaml
      - name: dispatch fail 
        run: |-
          gh workflow run \
            --repo gulducat/actions-tests-public \
            --ref main \
            --field should_fail=true \
            sleepy.yaml
  call-remote-success:
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main # remote repo
    with:
      should_fail: false
  call-remote-fail:
    needs: [call-remote-success]
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main
    with:
      should_fail: true
