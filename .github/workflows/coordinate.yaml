name: coordinate

on:
  push:
    branches: [cross-dispatch]
  workflow_dispatch:
    inputs:
      json: # format: {"ce": [{"source": "main", "dest": "release/1.11.0"}], "ent": []}
        type: string
        required: true

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
      - name: enter the matrix
        id: matrix
        run: |-
          ce="$(jq '.ce // []' <<< "${{ fromJSON(inputs.json) }}")"
          ent="$(jq '.ent // []' <<< "${{ fromJSON(inputs.json) }}")"
          if [[ -z "$ce" && -z "$ent" ]]; then
            echo 'found no "ce" nor "ent" in provided json'
            exit 1
          fi
          echo "ce: $ce"
          echo "ent: $ent"
          cat <<EOF >> "$GITHUB_OUTPUTS"
          ce="$ce"
          ent="$ent"
          EOF

  call-remote-ce:
    needs: [start]
    strategy:
      matrix:
        stuff: ${{ fromJSON(jobs.start.outputs.ce) }}
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main # remote repo
    secrets:
      gh_token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
    with:
      repo: gulducat/actions-tests-public
      source_branch: ${{ matrix.stuff.source }}
      dest_branch: ${{ matrix.stuff.dest }}

  call-remote-ent:
    needs: [start]
    strategy:
      matrix:
        stuff: ${{ fromJSON(jobs.start.outputs.ent) }}
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main # remote repo
    secrets:
      gh_token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
    with:
      repo: gulducat/actions-tests-private
      source_branch: ${{ matrix.stuff.source }}
      dest_branch: ${{ matrix.stuff.dest }}

