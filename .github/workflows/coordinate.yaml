name: coordinate

on:
  push:
    branches: [cross-dispatch]
  workflow_dispatch:
    inputs:
      latest_version: # targets main
        type: string
        required: false
      backport_1: # targets current latest release branch
        type: string
        required: false
      backport_2: # targets a backport branch
        type: string
        required: false
      backport_3: # ditto
        type: string
        required: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi

  call-remote-main:
    needs: [start]
    if: ${{ inputs.latest_version != '' }}
    strategy:
      matrix:
        stuff:
          - version: ${{ inputs.latest_version }}
            repo: gulducat/actions-tests-public
          - version: ${{ inputs.latest_version }}+private
            repo: gulducat/actions-tests-private
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main # remote repo
    secrets:
      gh_token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
    with:
      repo: ${{ matrix.stuff.repo }}
      source_branch: main
      dest_branch: ${{ matrix.stuff.version }}

  call-remote-backports:
    needs: [start]
    strategy:
      matrix:
        stuff:
          - version: ${{ inputs.backport_1 }}
            repo: gulducat/actions-tests-public
          - version: ${{ inputs.backport_1 }}+private
            repo: gulducat/actions-tests-private
          - version: ${{ inputs.backport_2 }}+private
            repo: gulducat/actions-tests-private
          - version: ${{ inputs.backport_3 }}+private
            repo: gulducat/actions-tests-private
    uses: gulducat/actions-tests-public/.github/workflows/sleepy.yaml@main
    secrets:
      gh_token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
    with:
      repo: ${{ matrix.stuff.repo }}
      source_branch: ${{ matrix.stuff.version }}
      dest_branch: ${{ matrix.version.version }}

